[pytest]
; Code tests for the probing pipeline. They build their own data in tmp_path and
; never read data/probing -- the checks on the real extracted files live in
; prob/data_checks.
;
;   pytest prob/tests                   # everything
;   pytest prob/tests -m "not slow"     # skip the end-to-end runs of prob_orchestrate.main
;   pytest prob/tests --no-cov          # without the coverage report
markers =
    slow: runs real probes end to end (a few seconds each)
addopts = --cov=prob --cov-report=term-missing:skip-covered
filterwarnings =
    ignore::DeprecationWarning
